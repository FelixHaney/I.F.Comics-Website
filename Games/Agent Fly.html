<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Fly</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            background: linear-gradient(#87c9ff, #5fa85a);
        }

        .ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px black;
            z-index: 5;
        }
    </style>
</head>

<body>

    <div class="ui">
        Score: <span id="score">0</span>
        <br>
        Health: <span id="health">100</span>
    </div>

    <canvas id="game"></canvas>

    <script>

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        canvas.width = innerWidth;
        canvas.height = innerHeight;

        const scoreEl = document.getElementById("score");
        const healthEl = document.getElementById("health");

        let score = 0;

        let gameStarted = false;
        let gameOver = false;

        const isMobile =
            /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        const keys = {};
        const bullets = [];
        const enemies = [];
        const enemyBullets = [];
        const particles = [];
        const powerups = [];

        let shooting = false;

        let damageFlash = 0;
        let screenShake = 0;

        let touchLeft = false;
        let touchRight = false;

        // PLAYER
        const helicopter = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 70,
            height: 70,
            speed: isMobile ? 6 : 7,
            health: 100,
            fireRate: 110,
            bulletSpeed: 12,
            lastShot: 0,
            powerTimer: 0,

            tripleShot: false,
            shield: false,
            laser: false
        };

        // KEYBOARD INPUT
        addEventListener("keydown", e => {

            keys[e.key.toLowerCase()] = true;

            if (e.key === "Enter") {

                if (!gameStarted) {
                    gameStarted = true;
                }

                else if (gameOver) {
                    location.reload();
                }
            }
        });

        addEventListener("keyup", e => {
            keys[e.key.toLowerCase()] = false;
        });

        // MOUSE INPUT
        addEventListener("mousedown", () => {
            shooting = true;
        });

        addEventListener("mouseup", () => {
            shooting = false;
        });

        // TOUCH INPUT
        addEventListener("touchstart", e => {

            if (!gameStarted) {
                gameStarted = true;
            }

            shooting = true;

            touchLeft = false;
            touchRight = false;

            for (const touch of e.touches) {

                if (touch.clientX < canvas.width / 2) {
                    touchLeft = true;
                }

                if (touch.clientX > canvas.width / 2) {
                    touchRight = true;
                }
            }

        }, { passive: false });

        addEventListener("touchmove", e => {

            touchLeft = false;
            touchRight = false;

            for (const touch of e.touches) {

                if (touch.clientX < canvas.width / 2) {
                    touchLeft = true;
                }

                if (touch.clientX > canvas.width / 2) {
                    touchRight = true;
                }
            }

        }, { passive: false });

        addEventListener("touchend", () => {

            shooting = false;

            touchLeft = false;
            touchRight = false;

        });

        // SHOOT
        function shoot() {

            const now = Date.now();

            if (now - helicopter.lastShot < helicopter.fireRate) return;

            helicopter.lastShot = now;

            // LASER
            if (helicopter.laser) {

                bullets.push({
                    x: helicopter.x,
                    y: helicopter.y - 40,
                    dx: 0,
                    dy: -18,
                    size: 10,
                    color: "cyan",
                    damage: 3
                });

                return;
            }

            // TRIPLE SHOT
            if (helicopter.tripleShot) {

                bullets.push({
                    x: helicopter.x,
                    y: helicopter.y - 25,
                    dx: 0,
                    dy: -helicopter.bulletSpeed,
                    size: 5,
                    color: "yellow",
                    damage: 1
                });

                bullets.push({
                    x: helicopter.x - 18,
                    y: helicopter.y - 25,
                    dx: -2,
                    dy: -helicopter.bulletSpeed,
                    size: 5,
                    color: "yellow",
                    damage: 1
                });

                bullets.push({
                    x: helicopter.x + 18,
                    y: helicopter.y - 25,
                    dx: 2,
                    dy: -helicopter.bulletSpeed,
                    size: 5,
                    color: "yellow",
                    damage: 1
                });

                return;
            }

            // NORMAL SHOT
            bullets.push({
                x: helicopter.x - 10,
                y: helicopter.y - 25,
                dx: 0,
                dy: -helicopter.bulletSpeed,
                size: 5,
                color: "yellow",
                damage: 1
            });

            bullets.push({
                x: helicopter.x + 10,
                y: helicopter.y - 25,
                dx: 0,
                dy: -helicopter.bulletSpeed,
                size: 5,
                color: "yellow",
                damage: 1
            });
        }

        // SPAWN ENEMY
        function spawnEnemy() {

            if (!gameStarted || gameOver) return;

            enemies.push({
                x: Math.random() * (canvas.width - 100) + 50,
                y: -50,
                width: 60,
                height: 60,
                speed: 2 + Math.random() * 1.5,

                // MORE HEALTH
                health: isMobile ? 7 : 3,
                wave: Math.random() * 6,
                shootCooldown: 80 + Math.random() * 100
            });
        }

        setInterval(spawnEnemy, 1800);

        // EXPLOSION
        function createExplosion(x, y, color) {

            for (let i = 0; i < 15; i++) {

                particles.push({
                    x,
                    y,
                    dx: (Math.random() - 0.5) * 6,
                    dy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 5 + 2,
                    life: 40,
                    color
                });
            }
        }

        // POWERUPS
        function spawnPowerup(x, y) {

            if (Math.random() < 0.18) {

                const types = [
                    "rapid",
                    "triple",
                    "health",
                    "shield",
                    "laser"
                ];

                const type =
                    types[Math.floor(Math.random() * types.length)];

                powerups.push({
                    x,
                    y,
                    size: 18,
                    type
                });
            }
        }

        // GAME OVER
        function triggerGameOver() {

            if (gameOver) return;

            gameOver = true;

            createExplosion(helicopter.x, helicopter.y, "orange");
            createExplosion(helicopter.x, helicopter.y, "red");
            createExplosion(helicopter.x, helicopter.y, "yellow");

            for (let i = 0; i < 5; i++) {

                setTimeout(() => {

                    createExplosion(
                        helicopter.x + (Math.random() - 0.5) * 50,
                        helicopter.y + (Math.random() - 0.5) * 50,
                        "orange"
                    );

                }, i * 120);
            }
        }

        // UPDATE
        function update() {

            if (!gameStarted || gameOver) return;

            // DESKTOP MOVEMENT
            if (keys["a"] || keys["arrowleft"]) {
                helicopter.x -= helicopter.speed;
            }

            if (keys["d"] || keys["arrowright"]) {
                helicopter.x += helicopter.speed;
            }

            // MOBILE MOVEMENT
            if (touchLeft) {
                helicopter.x -= helicopter.speed;
            }

            if (touchRight) {
                helicopter.x += helicopter.speed;
            }

            helicopter.x = Math.max(
                helicopter.width / 2,
                Math.min(canvas.width - helicopter.width / 2, helicopter.x)
            );

            // MOBILE AUTO SHOOT
            if (isMobile || shooting) {
                shoot();
            }

            // BULLETS
            for (let i = bullets.length - 1; i >= 0; i--) {

                const b = bullets[i];

                b.x += b.dx || 0;
                b.y += b.dy;

                if (b.y < -20) {
                    bullets.splice(i, 1);
                }
            }

            // ENEMIES
            for (let i = enemies.length - 1; i >= 0; i--) {

                const e = enemies[i];

                e.y += e.speed;
                e.x += Math.sin(e.y * 0.03) * e.wave;

                e.shootCooldown--;

                if (e.shootCooldown <= 0) {

                    enemyBullets.push({
                        x: e.x,
                        y: e.y + 20,
                        dy: 5,
                        size: 5
                    });

                    e.shootCooldown = 120;
                }

                // ESCAPED
                if (e.y > canvas.height + 100) {

                    enemies.splice(i, 1);

                    if (!helicopter.shield) {
                        helicopter.health -= 15;
                    }

                    healthEl.textContent = helicopter.health;

                    damageFlash = 12;
                    screenShake = 12;

                    continue;
                }

                // BULLET HIT
                for (let j = bullets.length - 1; j >= 0; j--) {

                    const b = bullets[j];

                    const dist = Math.hypot(e.x - b.x, e.y - b.y);

                    if (dist < 30) {

                        bullets.splice(j, 1);

                        e.health -= b.damage || 1;

                        createExplosion(b.x, b.y, "orange");

                        if (e.health <= 0) {

                            createExplosion(e.x, e.y, "red");

                            enemies.splice(i, 1);

                            score += 10;

                            scoreEl.textContent = score;

                            spawnPowerup(e.x, e.y);

                            break;
                        }
                    }
                }

                // PLAYER COLLISION
                const playerDist = Math.hypot(
                    helicopter.x - e.x,
                    helicopter.y - e.y
                );

                if (playerDist < 45) {

                    createExplosion(e.x, e.y, "red");

                    enemies.splice(i, 1);

                    if (!helicopter.shield) {
                        helicopter.health -= 20;
                    }

                    healthEl.textContent = helicopter.health;

                    damageFlash = 12;
                    screenShake = 12;
                }
            }

            // ENEMY BULLETS
            for (let i = enemyBullets.length - 1; i >= 0; i--) {

                const b = enemyBullets[i];

                b.y += b.dy;

                if (b.y > canvas.height + 20) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                const dist = Math.hypot(
                    helicopter.x - b.x,
                    helicopter.y - b.y
                );

                if (dist < 30) {

                    enemyBullets.splice(i, 1);

                    if (!helicopter.shield) {
                        helicopter.health -= 5;
                    }

                    healthEl.textContent = helicopter.health;

                    createExplosion(b.x, b.y, "yellow");

                    damageFlash = 8;
                    screenShake = 8;
                }
            }

            // PARTICLES
            for (let i = particles.length - 1; i >= 0; i--) {

                const p = particles[i];

                p.x += p.dx;
                p.y += p.dy;

                p.life--;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // POWERUPS
            for (let i = powerups.length - 1; i >= 0; i--) {

                const p = powerups[i];

                p.y += 2;

                const dist = Math.hypot(
                    helicopter.x - p.x,
                    helicopter.y - p.y
                );

                if (dist < 40) {

                    if (p.type === "rapid") {

                        helicopter.fireRate = 55;
                        helicopter.powerTimer = 500;
                    }

                    if (p.type === "triple") {

                        helicopter.tripleShot = true;

                        setTimeout(() => {
                            helicopter.tripleShot = false;
                        }, 8000);
                    }

                    if (p.type === "health") {

                        helicopter.health += 25;

                        if (helicopter.health > 100) {
                            helicopter.health = 100;
                        }

                        healthEl.textContent = helicopter.health;
                    }

                    if (p.type === "shield") {

                        helicopter.shield = true;

                        setTimeout(() => {
                            helicopter.shield = false;
                        }, 8000);
                    }

                    if (p.type === "laser") {

                        helicopter.laser = true;

                        setTimeout(() => {
                            helicopter.laser = false;
                        }, 7000);
                    }

                    powerups.splice(i, 1);
                }
            }

            // RAPID FIRE TIMER
            if (helicopter.powerTimer > 0) {

                helicopter.powerTimer--;

                if (helicopter.powerTimer <= 0) {
                    helicopter.fireRate = 110;
                }
            }

            // DEATH
            if (helicopter.health <= 0) {

                helicopter.health = 0;

                healthEl.textContent = helicopter.health;

                triggerGameOver();
            }
        }

        // DRAW PLAYER
        function drawHelicopter() {

            if (gameOver) return;

            ctx.save();

            ctx.translate(helicopter.x, helicopter.y);

            // TAIL
            ctx.fillStyle = "#2c2c2c";
            ctx.fillRect(-6, 18, 12, 36);

            ctx.beginPath();
            ctx.moveTo(-10, 54);
            ctx.lineTo(0, 68);
            ctx.lineTo(10, 54);
            ctx.fill();

            // BODY
            const bodyGradient = ctx.createLinearGradient(
                -25, -30,
                25, 30
            );

            bodyGradient.addColorStop(0, "#555");
            bodyGradient.addColorStop(1, "#1d1d1d");

            ctx.fillStyle = bodyGradient;

            ctx.beginPath();
            ctx.ellipse(0, 0, 24, 32, 0, 0, Math.PI * 2);
            ctx.fill();

            // COCKPIT
            const glassGradient = ctx.createLinearGradient(
                -10, -18,
                10, 12
            );

            glassGradient.addColorStop(0, "#c8f5ff");
            glassGradient.addColorStop(1, "#3caeff");

            ctx.fillStyle = glassGradient;

            ctx.beginPath();
            ctx.ellipse(0, -8, 11, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            // WINGS
            ctx.fillStyle = "#3a3a3a";

            ctx.beginPath();
            ctx.moveTo(-42, 0);
            ctx.lineTo(-18, -6);
            ctx.lineTo(-18, 6);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(42, 0);
            ctx.lineTo(18, -6);
            ctx.lineTo(18, 6);
            ctx.fill();

            // ROTOR BASE
            ctx.fillStyle = "#111";

            ctx.beginPath();
            ctx.arc(0, -32, 6, 0, Math.PI * 2);
            ctx.fill();

            // MAIN ROTOR
            ctx.save();

            ctx.translate(0, -32);
            ctx.rotate((Date.now() * 0.01) % 360);

            ctx.strokeStyle = "#111";
            ctx.lineWidth = 5;
            ctx.lineCap = "round";

            ctx.beginPath();
            ctx.moveTo(-55, 0);
            ctx.lineTo(55, 0);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, -55);
            ctx.lineTo(0, 55);
            ctx.stroke();

            ctx.restore();

            // ROTOR BLUR
            ctx.save();

            ctx.translate(0, -32);

            ctx.strokeStyle = "rgba(255,255,255,0.12)";
            ctx.lineWidth = 18;

            ctx.beginPath();
            ctx.arc(0, 0, 42, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();

            // TAIL ROTOR
            ctx.save();

            ctx.translate(0, 58);
            ctx.rotate(Date.now() * 0.15);

            ctx.strokeStyle = "#000";
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(-10, 0);
            ctx.lineTo(10, 0);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(0, 10);
            ctx.stroke();

            ctx.restore();

            // SHIELD
            if (helicopter.shield) {

                ctx.strokeStyle = "rgba(180,100,255,0.8)";
                ctx.lineWidth = 4;

                ctx.beginPath();
                ctx.arc(0, 0, 45, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        // DRAW ENEMY
        function drawEnemy(e) {

            ctx.save();

            ctx.translate(e.x, e.y);

            ctx.fillStyle = "#555";
            ctx.fillRect(-30, -5, 60, 10);

            ctx.fillStyle = "#aa2222";
            ctx.fillRect(-14, -20, 28, 40);

            ctx.fillStyle = "#ff7777";
            ctx.fillRect(-8, -10, 16, 20);

            ctx.restore();
        }

        // DRAW
        function draw() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // SHAKE
            if (screenShake > 0) {

                const shakeX = (Math.random() - 0.5) * 10;
                const shakeY = (Math.random() - 0.5) * 10;

                ctx.save();
                ctx.translate(shakeX, shakeY);

                screenShake--;
            }

            // BACKGROUND
            ctx.fillStyle = "#4d8a3d";

            for (let i = 0; i < canvas.height; i += 60) {

                ctx.fillRect(
                    0,
                    (i + Date.now() * 0.08) % canvas.height,
                    canvas.width,
                    2
                );
            }

            // PLAYER
            drawHelicopter();

            // BULLETS
            bullets.forEach(b => {

                ctx.fillStyle = b.color || "yellow";

                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // ENEMIES
            enemies.forEach(drawEnemy);

            // ENEMY BULLETS
            ctx.fillStyle = "orange";

            enemyBullets.forEach(b => {

                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // PARTICLES
            particles.forEach(p => {

                ctx.globalAlpha = p.life / 40;

                ctx.fillStyle = p.color;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                ctx.globalAlpha = 1;
            });

            // POWERUPS
            powerups.forEach(p => {

                if (p.type === "rapid") ctx.fillStyle = "cyan";
                if (p.type === "triple") ctx.fillStyle = "orange";
                if (p.type === "health") ctx.fillStyle = "lime";
                if (p.type === "shield") ctx.fillStyle = "violet";
                if (p.type === "laser") ctx.fillStyle = "red";

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = "18px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                let icon = "";

                if (p.type === "rapid") icon = "⚡";
                if (p.type === "triple") icon = "3️⃣";
                if (p.type === "health") icon = "❤️";
                if (p.type === "shield") icon = "🛡️";
                if (p.type === "laser") icon = "🔥";

                ctx.fillText(icon, p.x, p.y + 1);
            });

            // DAMAGE FLASH
            if (damageFlash > 0) {

                ctx.fillStyle = "rgba(255,0,0,0.2)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                damageFlash--;
            }

            if (screenShake >= 0) {
                ctx.restore();
            }

            // TEXT SIZES
            const titleSize = isMobile ? 48 : 80;
            const normalSize = isMobile ? 18 : 30;
            const controlsSize = isMobile ? 16 : 24;
            const pressSize = isMobile ? 24 : 36;

            // INTRO SCREEN
            if (!gameStarted) {

                ctx.fillStyle = "rgba(0,0,0,0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "white";
                ctx.textAlign = "center";

                ctx.font = titleSize + "px Arial Black";

                ctx.fillText(
                    "AGENT FLY",
                    canvas.width / 2,
                    canvas.height / 2 - 120
                );

                ctx.font = normalSize + "px Arial";

                ctx.fillText(
                    "Destroy enemy aircraft.",
                    canvas.width / 2,
                    canvas.height / 2 - 40
                );

                ctx.font = controlsSize + "px Arial";

                if (isMobile) {

                    ctx.fillText(
                        "Touch left/right side to move",
                        canvas.width / 2,
                        canvas.height / 2 + 30
                    );

                    ctx.fillText(
                        "Hold screen to shoot",
                        canvas.width / 2,
                        canvas.height / 2 + 70
                    );

                } else {

                    ctx.fillText(
                        "A / D or Arrow Keys = Move",
                        canvas.width / 2,
                        canvas.height / 2 + 40
                    );

                    ctx.fillText(
                        "Hold Mouse = Shoot",
                        canvas.width / 2,
                        canvas.height / 2 + 80
                    );
                }

                ctx.font = pressSize + "px Arial Black";
                ctx.fillStyle = "yellow";

                ctx.fillText(
                    isMobile
                        ? "TAP TO PLAY"
                        : "PRESS ENTER TO PLAY",
                    canvas.width / 2,
                    canvas.height / 2 + 180
                );
            }

            // GAME OVER
            if (gameOver) {

                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "red";
                ctx.textAlign = "center";

                ctx.font = (isMobile ? 50 : 90) + "px Arial Black";

                ctx.fillText(
                    "GAME OVER",
                    canvas.width / 2,
                    canvas.height / 2 - 50
                );

                ctx.fillStyle = "white";
                ctx.font = (isMobile ? 24 : 36) + "px Arial";

                ctx.fillText(
                    "Final Score: " + score,
                    canvas.width / 2,
                    canvas.height / 2 + 30
                );

                ctx.font = (isMobile ? 22 : 32) + "px Arial";
                ctx.fillStyle = "yellow";

                ctx.fillText(
                    isMobile
                        ? "REFRESH TO RESTART"
                        : "PRESS ENTER TO RESTART",
                    canvas.width / 2,
                    canvas.height / 2 + 120
                );
            }

            // MOBILE BUTTONS
            if (isMobile && gameStarted && !gameOver) {

                ctx.globalAlpha = 0.25;

                // LEFT
                ctx.fillStyle = "white";

                ctx.beginPath();
                ctx.arc(90, canvas.height - 90, 60, 0, Math.PI * 2);
                ctx.fill();

                // RIGHT
                ctx.beginPath();
                ctx.arc(canvas.width - 90, canvas.height - 90, 60, 0, Math.PI * 2);
                ctx.fill();

                ctx.globalAlpha = 1;

                ctx.fillStyle = "black";

                ctx.font = "40px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                ctx.fillText(
                    "◀",
                    90,
                    canvas.height - 90
                );

                ctx.fillText(
                    "▶",
                    canvas.width - 90,
                    canvas.height - 90
                );
            }
        }

        // LOOP
        function gameLoop() {

            update();
            draw();

            requestAnimationFrame(gameLoop);
        }

        gameLoop();

        // RESIZE
        addEventListener("resize", () => {

            canvas.width = innerWidth;
            canvas.height = innerHeight;
        });

    </script>

</body>

</html>
