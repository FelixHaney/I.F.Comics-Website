<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#111111">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Stickman Runner</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1b1b1b;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;

      touch-action: none;
    }

    /* GAME */

    #gameContainer {
      width: 100vw;
      height: 100vh;

      position: relative;
      overflow: hidden;

      background-image:
        linear-gradient(to bottom,
          #4da6ff 0%,
          #87ceeb 60%,
          #dff6ff 100%);
    }

    /* MOUNTAINS */

    .mountains {
      position: absolute;

      bottom: 120px;

      width: 300%;
      height: 250px;

      background:
        linear-gradient(135deg,
          transparent 75%,
          #2d5a27 75%) 0 0 / 250px 250px,

        linear-gradient(225deg,
          transparent 75%,
          #3d6b37 75%) 125px 0 / 250px 250px;

      animation:
        mountainScroll 2s linear infinite;

      opacity: 0.9;

      z-index: 1;
    }

    @keyframes mountainScroll {

      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-250px);
      }
    }

    /* GROUND */

    #ground {
      position: absolute;

      bottom: 0;

      width: 100%;
      height: 120px;

      background: #111;

      border-top: 5px solid #555;

      z-index: 2;
    }

    /* PLAYER */

    #player {
      position: absolute;

      left: 120px;
      bottom: 120px;

      width: 70px;
      height: 120px;

      z-index: 10;
    }

    /* HEAD */

    .head {
      position: absolute;

      width: 24px;
      height: 24px;

      background: black;
      border-radius: 50%;

      left: 20px;
      top: 7px;
    }

    /* BODY */

    .torso {
      position: absolute;

      width: 10px;
      height: 45px;

      background: black;
      border-radius: 10px;

      left: 26px;
      top: 30px;
    }

    /* ARMS */

    .arm {
      position: absolute;

      width: 32px;
      height: 8px;

      background: black;
      border-radius: 10px;

      top: 40px;

      transform-origin: left center;
    }

    .arm-left {
      left: 30px;

      animation:
        armSwingLeft 0.4s infinite alternate;
    }

    .arm-right {
      left: 30px;

      animation:
        armSwingRight 0.4s infinite alternate;
    }

    /* LEGS */

    .leg {
      position: absolute;

      width: 40px;
      height: 9px;

      background: black;
      border-radius: 10px;

      top: 70px;
      left: 32px;

      transform-origin: left center;
    }

    .leg-left {
      animation:
        legSwingLeft 0.25s infinite alternate;
    }

    .leg-right {
      animation:
        legSwingRight 0.25s infinite alternate;
    }

    /* LEG ANIMATION */

    @keyframes legSwingLeft {

      from {
        transform: rotate(125deg);
      }

      to {
        transform: rotate(55deg);
      }
    }

    @keyframes legSwingRight {

      from {
        transform: rotate(55deg);
      }

      to {
        transform: rotate(125deg);
      }
    }

    /* ARM ANIMATION */

    @keyframes armSwingLeft {

      from {
        transform: rotate(50deg);
      }

      to {
        transform: rotate(115deg);
      }
    }

    @keyframes armSwingRight {

      from {
        transform: rotate(115deg);
      }

      to {
        transform: rotate(50deg);
      }
    }

    /* OBSTACLES */



    /* GENERAL */

    .obstacle {
      position: absolute;

      z-index: 9;
    }

    /* LOG */

    .groundObstacle {

      width: 85px;
      height: 20px;

      bottom: 120px;

      border-radius: 20px;

      background:
        linear-gradient(to bottom,
          #6b3e1f,
          #4a2c17);

      border: 3px solid #2d160a;

      transform: rotate(-8deg);
    }

    /* Tiny branch pieces */

    .groundObstacle::before,
    .groundObstacle::after {

      content: '';

      position: absolute;

      width: 18px;
      height: 8px;

      background: #4a2c17;

      border-radius: 10px;
    }

    .groundObstacle::before {

      left: 18px;
      top: -5px;

      transform: rotate(35deg);
    }

    .groundObstacle::after {

      right: 20px;
      bottom: -5px;

      transform: rotate(-35deg);
    }

    /* Log rings */

    .groundObstacle::before,
    .groundObstacle::after {

      content: '';

      position: absolute;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      border: 3px solid #4a2c17;

      top: 9px;

      background: #a36b3f;
    }

    .groundObstacle::before {
      left: 8px;
    }

    .groundObstacle::after {
      right: 8px;
    }

    /* FLOATING SAW */

    .airObstacle {

      width: 70px;
      height: 70px;

      bottom: 200px;

      position: absolute;

      border-radius: 50%;

      background:
        repeating-conic-gradient(#999 0deg 20deg,
          #555 20deg 40deg);

      border: 6px solid #222;

      box-shadow:
        0 0 12px rgba(255, 255, 255, 0.2);

      animation:
        sawSpin 0.4s linear infinite;

      z-index: 9;
    }

    /* CENTER */

    .airObstacle::before {

      content: '';

      position: absolute;

      width: 18px;
      height: 18px;

      background: #222;

      border-radius: 50%;

      top: 20px;
      left: 20px;
    }

    /* SPIN */

    @keyframes sawSpin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    /* Tiny branch pieces */

    .airObstacle::before,
    .airObstacle::after {

      content: '';

      position: absolute;

      width: 18px;
      height: 8px;

      background: #4a2c17;

      border-radius: 10px;
    }

    .airObstacle::before {

      left: 18px;
      top: -5px;

      transform: rotate(35deg);
    }

    .airObstacle::after {

      right: 20px;
      bottom: -5px;

      transform: rotate(-35deg);
    }

    /* SCORE */

    #score {
      position: absolute;

      top: 20px;
      left: 20px;

      font-size: 2rem;
      font-weight: bold;

      color: white;

      z-index: 100;
    }

    /* CONTROLS */

    #controls {
      position: absolute;

      top: 70px;
      left: 20px;

      color: #ccc;

      font-size: 1rem;

      z-index: 100;
    }

    /* START */

    #startMessage {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      font-size: 2rem;

      color: white;

      text-align: center;

      z-index: 100;
    }

    /* GAME OVER */

    #gameOverScreen {
      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      background: rgba(0, 0, 0, 0.75);

      display: none;

      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      backdrop-filter: blur(8px);

      z-index: 9999;

      padding: 20px;
    }

    #gameOverScreen h1 {
      font-size: 5rem;

      color: white;

      margin-bottom: 10px;

      letter-spacing: 4px;
    }

    #gameOverScreen p {
      font-size: 1.5rem;

      color: #ddd;

      margin-bottom: 30px;
    }

    #gameOverScreen button {
      padding: 16px 40px;

      font-size: 1.3rem;
      font-weight: bold;

      border: none;
      border-radius: 18px;

      cursor: pointer;

      background: white;
      color: black;

      transition: 0.2s;
    }

    #gameOverScreen button:hover {
      transform: scale(1.08);
    }

    /* MOBILE */

    #mobileControls {
      position: absolute;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      display: none;

      gap: 20px;

      z-index: 100;
    }

    #mobileControls button {
      width: 120px;
      height: 70px;

      border: none;
      border-radius: 20px;

      background: rgba(255, 255, 255, 0.2);

      color: white;

      font-size: 1.2rem;
      font-weight: bold;

      backdrop-filter: blur(5px);

      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    @media (max-width: 900px) {

      #mobileControls {
        display: flex;
      }

      #controls {
        display: none;
      }

      #score {
        font-size: 1.5rem;
      }

      #startMessage {
        width: 90%;
        font-size: 1.4rem;
      }

      #gameOverScreen h1 {
        font-size: 3rem;
      }
    }
  </style>
</head>

<body>

  <div id="gameContainer">

    <div id="score">
      Score: 0
    </div>

    <div id="controls">
      SPACE / W / UP = Jump<br>
      S / DOWN = Duck
    </div>

    <div id="startMessage">
      Press SPACE to Start
    </div>

    <!-- PLAYER -->

    <div id="player">

      <div class="head"></div>

      <div class="torso"></div>

      <div class="arm arm-left"></div>
      <div class="arm arm-right"></div>

      <div class="leg leg-left"></div>
      <div class="leg leg-right"></div>

    </div>

    <!-- BACKGROUND -->

    <div class="mountains"></div>

    <!-- GROUND -->

    <div id="ground"></div>

    <!-- MOBILE -->

    <div id="mobileControls">

      <button id="jumpBtn">
        JUMP
      </button>

      <button id="duckBtn">
        DUCK
      </button>

    </div>

    <!-- GAME OVER -->

    <div id="gameOverScreen">

      <h1>GAME OVER</h1>

      <p id="finalScore">
        Score: 0
      </p>

      <button onclick="restartGame()">
        Restart
      </button>

    </div>

  </div>

  <script>

    const gameContainer =
      document.getElementById('gameContainer');

    const player =
      document.getElementById('player');

    const scoreDisplay =
      document.getElementById('score');

    const gameOverScreen =
      document.getElementById('gameOverScreen');

    const startMessage =
      document.getElementById('startMessage');

    const jumpBtn =
      document.getElementById('jumpBtn');

    const duckBtn =
      document.getElementById('duckBtn');

    let obstacles = [];

    let gameStarted = false;
    let gameOver = false;

    let playerY = 0;
    let velocityY = 0;

    let gravity = 0.9;
    let jumpPower = 17;

    let isJumping = false;
    let isDucking = false;

    let score = 0;

    let obstacleSpeed =
      window.innerWidth < 900 ? 4.5 : 7;

    let obstacleSpawnTimer = 0;

    /* START */

    function startGame() {

      if (gameStarted) return;

      gameStarted = true;

      startMessage.style.display = 'none';

      requestAnimationFrame(gameLoop);
    }

    /* JUMP */

    function jump() {

      if (!isJumping && !gameOver) {

        velocityY = jumpPower;

        isJumping = true;
      }
    }

    /* DUCK */

    function duck(state) {

      if (gameOver) return;

      isDucking = state;

      if (state) {

        player.style.height = '60px';

      } else {

        player.style.height = '120px';
      }
    }

    /* KEYBOARD */

    document.addEventListener('keydown', (e) => {

      if (
        e.code === 'Space' ||
        e.code === 'ArrowUp' ||
        e.code === 'KeyW'
      ) {

        startGame();

        jump();
      }

      if (
        e.code === 'ArrowDown' ||
        e.code === 'KeyS'
      ) {

        duck(true);
      }
    });

    document.addEventListener('keyup', (e) => {

      if (
        e.code === 'ArrowDown' ||
        e.code === 'KeyS'
      ) {

        duck(false);
      }
    });

    /* MOBILE */

    jumpBtn.addEventListener('touchstart', (e) => {

      e.preventDefault();

      startGame();

      jump();
    });

    duckBtn.addEventListener('touchstart', (e) => {

      e.preventDefault();

      duck(true);
    });

    duckBtn.addEventListener('touchend', (e) => {

      e.preventDefault();

      duck(false);
    });

    /* CREATE OBSTACLE */

    function createObstacle() {

      const obstacle =
        document.createElement('div');

      const type =
        Math.random() > 0.5
          ? 'ground'
          : 'air';

      obstacle.classList.add('obstacle');

      if (type === 'ground') {

        obstacle.classList.add(
          'groundObstacle'
        );

      } else {

        obstacle.classList.add(
          'airObstacle'
        );
      }

      obstacle.style.left =
        window.innerWidth + 'px';

      gameContainer.appendChild(obstacle);

      obstacles.push({
        element: obstacle,
        x: window.innerWidth,
        type
      });
    }

    /* PLAYER UPDATE */

    function updatePlayer() {

      velocityY -= gravity;

      playerY += velocityY;

      if (playerY <= 0) {

        playerY = 0;

        velocityY = 0;

        isJumping = false;
      }

      player.style.bottom =
        (120 + playerY) + 'px';
    }

    /* OBSTACLES */

    function updateObstacles() {

      obstacleSpawnTimer++;

      if (obstacleSpawnTimer > 90) {

        createObstacle();

        obstacleSpawnTimer = 0;
      }

      for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
      ) {

        const obs = obstacles[i];

        obs.x -= obstacleSpeed;

        obs.element.style.left =
          obs.x + 'px';

        if (obs.x < -100) {

          obs.element.remove();

          obstacles.splice(i, 1);

          score++;

          scoreDisplay.textContent =
            'Score: ' + score;

          if (score % 5 === 0) {

            obstacleSpeed += 0.4;
          }

          continue;
        }

        checkCollision(obs);
      }
    }

    /* COLLISION */

    function checkCollision(obs) {

      const playerRect =
        player.getBoundingClientRect();

      const obstacleRect =
        obs.element.getBoundingClientRect();

      if (
        playerRect.left < obstacleRect.right &&
        playerRect.right > obstacleRect.left &&
        playerRect.top < obstacleRect.bottom &&
        playerRect.bottom > obstacleRect.top
      ) {

        endGame();
      }
    }

    /* END GAME */

    function endGame() {

      duck(false);

      gameOver = true;

      document.getElementById(
        'finalScore'
      ).textContent =
        'Final Score: ' + score;

      gameOverScreen.style.display =
        'flex';
    }

    /* LOOP */

    function gameLoop() {

      if (gameOver) return;

      updatePlayer();

      updateObstacles();

      requestAnimationFrame(gameLoop);
    }

    /* RESTART */

    function restartGame() {

      obstacles.forEach(
        obs => obs.element.remove()
      );

      obstacles = [];

      gameOver = false;

      gameStarted = true;

      playerY = 0;

      velocityY = 0;

      isDucking = false;

      player.style.height = '120px';

      duck(false);

      score = 0;

      obstacleSpeed =
        window.innerWidth < 900
          ? 4.5
          : 7;

      scoreDisplay.textContent =
        'Score: 0';

      gameOverScreen.style.display =
        'none';

      requestAnimationFrame(gameLoop);
    }

  </script>

</body>

</html>
