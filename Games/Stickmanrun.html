<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Stickman Run</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1b1b1b;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      color: white;
      touch-action: none;
    }

    #gameContainer {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;

      background-image:
        linear-gradient(to bottom, #4da6ff 0%, #87ceeb 60%, #dff6ff 100%);

      animation: skyMove 20s linear infinite;
    }

    @keyframes skyMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: -2000px 0;
      }
    }

    #ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 120px;
      background: #111;
      border-top: 5px solid #555;
    }

    #player {
      position: absolute;
      left: 120px;
      bottom: 120px;
      width: 50px;
      height: 100px;
      transition: height 0.1s;
      z-index: 10;
    }

    #player {
      position: absolute;
      left: 120px;
      bottom: 120px;

      width: 70px;
      height: 120px;

      z-index: 10;
    }

    /* HEAD */

    .head {
      position: absolute;

      width: 24px;
      height: 24px;

      background: black;
      border-radius: 50%;

      left: 23px;
      top: 10px;
    }

    /* BODY */

    .torso {
      position: absolute;

      width: 10px;
      height: 45px;

      background: black;
      border-radius: 10px;

      left: 30px;
      top: 30px;
    }

    /* ARMS */

    .arm {
      position: absolute;

      width: 32px;
      height: 8px;

      background: black;
      border-radius: 10px;

      top: 40px;
      left: 34px;

      transform-origin: left center;
    }

    .arm-left {
      animation: armSwingLeft 0.4s infinite alternate;
    }

    .arm-right {
      animation: armSwingRight 0.4s infinite alternate;
    }

    /* LEGS */

    .leg {
      position: absolute;

      width: 40px;
      height: 9px;

      background: black;
      border-radius: 10px;

      top: 70px;
      left: 35px;

      transform-origin: left center;
    }

    /* Alternating running motion */

    .leg-left {
      animation: legSwingLeft 0.25s infinite alternate;
    }

    .leg-right {
      animation: legSwingRight 0.25s infinite alternate;
    }

    /* ANIMATIONS */

    @keyframes legSwingLeft {
      from {
        transform: rotate(125deg);
      }

      to {
        transform: rotate(55deg);
      }
    }

    @keyframes legSwingRight {
      from {
        transform: rotate(55deg);
      }

      to {
        transform: rotate(125deg);
      }
    }

    @keyframes armSwingLeft {
      from {
        transform: rotate(50deg);
      }

      to {
        transform: rotate(115deg);
      }
    }

    @keyframes armSwingRight {
      from {
        transform: rotate(115deg);
      }

      to {
        transform: rotate(50deg);
      }
    }

    .obstacle {
      position: absolute;
      background: crimson;
      border-radius: 5px;
      z-index: 9;
    }

    .groundObstacle {
      width: 40px;
      height: 60px;
      bottom: 120px;
    }

    .airObstacle {
      width: 55px;
      height: 25px;
      bottom: 190px;
    }

    #score {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 2rem;
      font-weight: bold;
    }

    #controls {
      position: absolute;
      top: 70px;
      left: 20px;
      color: #ccc;
      font-size: 1rem;
    }

    #gameOverScreen {
      position: absolute;
      inset: 0;

      background: rgba(0, 0, 0, 0.75);

      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;

      backdrop-filter: blur(8px);

      z-index: 1000;

      animation: fadeIn 0.3s ease;
    }

    #gameOverScreen h1 {
      font-size: 5rem;

      color: white;

      margin-bottom: 10px;

      letter-spacing: 4px;

      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.4),
        0 0 20px rgba(255, 255, 255, 0.3);
    }

    #gameOverScreen {
      text-align: center;
      padding: 20px;
    }

    #gameOverScreen h1,
    #gameOverScreen p,
    #gameOverScreen button {
      margin-left: auto;
      margin-right: auto;
    }

    #gameOverScreen p {
      font-size: 1.5rem;

      color: #ddd;

      margin-bottom: 30px;
    }

    #gameOverScreen button {
      padding: 16px 40px;

      font-size: 1.3rem;
      font-weight: bold;

      border: none;
      border-radius: 18px;

      cursor: pointer;

      background: white;
      color: black;

      transition: 0.2s;
    }

    #gameOverScreen button:hover {
      transform: scale(1.08);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    #startMessage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      opacity: 0.9;
      text-align: center;
    }

    @media (max-width: 700px) {
      #score {
        font-size: 1.5rem;
      }

      #startMessage {
        width: 90%;
        font-size: 1.4rem;
      }
    }

    .mountains {
      position: absolute;
      bottom: 120px;
      width: 300%;
      height: 250px;

      background:
        linear-gradient(135deg, transparent 75%, #2d5a27 75%) 0 0 / 250px 250px,
        linear-gradient(225deg, transparent 75%, #3d6b37 75%) 125px 0 / 250px 250px;

      animation: mountainScroll 2s linear infinite;

      opacity: 0.9;

      z-index: 1;
    }

    @keyframes mountainScroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-250px);
      }
    }

    #mobileControls {
      position: absolute;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      display: none;
      gap: 20px;

      z-index: 100;
    }

    #mobileControls button {
      width: 120px;
      height: 70px;

      border: none;
      border-radius: 20px;

      background: rgba(255, 255, 255, 0.2);

      color: white;
      font-size: 1.2rem;
      font-weight: bold;

      backdrop-filter: blur(5px);

      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    /* Show controls on phones/tablets */

    @media (max-width: 900px) {
      #mobileControls {
        display: flex;
      }

      #controls {
        display: none;
      }

      #score {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <div id="gameContainer">

    <div id="score">Score: 0</div>

    <div id="controls">
      SPACE / W / UP = Jump<br>
      S / DOWN = Duck
    </div>

    <div id="startMessage">
      Press SPACE to Start
    </div>

    <div id="player">

      <div class="head"></div>

      <div class="torso"></div>

      <div class="arm arm-left"></div>
      <div class="arm arm-right"></div>

      <div class="leg leg-left"></div>
      <div class="leg leg-right"></div>

    </div>
    <div class="mountains"></div>
    <div id="ground"></div>
    <div id="mobileControls">

      <button id="jumpBtn">JUMP</button>

      <button id="duckBtn">DUCK</button>

    </div>

    <div id="gameOverScreen">
      <h1>GAME OVER</h1>

      <p id="finalScore">Score: 0</p>

      <button onclick="restartGame()">
        Restart
      </button>
    </div>

  </div>

  <script>
    const gameContainer = document.getElementById('gameContainer');
    const player = document.getElementById('player');
    const scoreDisplay = document.getElementById('score');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const startMessage = document.getElementById('startMessage');

    let obstacles = [];

    let gameStarted = false;
    let gameOver = false;

    let playerY = 0;
    let velocityY = 0;

    let gravity = 0.9;
    let jumpPower = 17;

    let isJumping = false;
    let isDucking = false;

    let score = 0;

    let obstacleSpeed = window.innerWidth < 900 ? 4.5 : 7;
    let obstacleSpawnTimer = 0;

    function startGame() {
      if (gameStarted) return;

      gameStarted = true;
      startMessage.style.display = 'none';

      requestAnimationFrame(gameLoop);
    }

    function jump() {
      if (!isJumping && !gameOver) {
        velocityY = jumpPower;
        isJumping = true;
      }
    }

    function duck(state) {
      if (gameOver) return;

      isDucking = state;

      if (state) {
        player.style.height = '60px';
      } else {
        player.style.height = '100px';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (
        e.code === 'Space' ||
        e.code === 'ArrowUp' ||
        e.code === 'KeyW'
      ) {
        startGame();
        jump();
      }

      if (
        e.code === 'ArrowDown' ||
        e.code === 'KeyS'
      ) {
        duck(true);
      }
    });

    document.addEventListener('keyup', (e) => {
      if (
        e.code === 'ArrowDown' ||
        e.code === 'KeyS'
      ) {
        duck(false);
      }
    });

    const jumpBtn = document.getElementById('jumpBtn');
    const duckBtn = document.getElementById('duckBtn');

    /* JUMP */

    jumpBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();

      startGame();
      jump();
    });

    /* DUCK */

    duckBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();

      duck(true);
    });

    duckBtn.addEventListener('touchend', (e) => {
      e.preventDefault();

      duck(false);
    });

    function createObstacle() {
      const obstacle = document.createElement('div');

      const type = Math.random() > 0.5 ? 'ground' : 'air';

      obstacle.classList.add('obstacle');

      if (type === 'ground') {
        obstacle.classList.add('groundObstacle');
      } else {
        obstacle.classList.add('airObstacle');
      }

      obstacle.style.left = window.innerWidth + 'px';

      gameContainer.appendChild(obstacle);

      obstacles.push({
        element: obstacle,
        x: window.innerWidth,
        type
      });
    }

    function updatePlayer() {
      velocityY -= gravity;
      playerY += velocityY;

      if (playerY <= 0) {
        playerY = 0;
        velocityY = 0;
        isJumping = false;
      }

      player.style.bottom = (120 + playerY) + 'px';
    }

    function updateObstacles() {
      obstacleSpawnTimer++;

      if (obstacleSpawnTimer > 90) {
        createObstacle();
        obstacleSpawnTimer = 0;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];

        obs.x -= obstacleSpeed;
        obs.element.style.left = obs.x + 'px';

        if (obs.x < -100) {
          obs.element.remove();
          obstacles.splice(i, 1);

          score++;
          scoreDisplay.textContent = 'Score: ' + score;

          if (score % 5 === 0) {
            obstacleSpeed += 0.4;
          }

          continue;
        }

        checkCollision(obs);
      }
    }

    function checkCollision(obs) {
      const playerRect = player.getBoundingClientRect();
      const obstacleRect = obs.element.getBoundingClientRect();

      if (
        playerRect.left < obstacleRect.right &&
        playerRect.right > obstacleRect.left &&
        playerRect.top < obstacleRect.bottom &&
        playerRect.bottom > obstacleRect.top
      ) {
        endGame();
      }
    }

    function endGame() {
      duck(false);
      gameOver = true;

      document.getElementById('finalScore').textContent =
        'Final Score: ' + score;

      gameOverScreen.style.display = 'flex';

    }

    function gameLoop() {
      if (gameOver) return;

      updatePlayer();
      updateObstacles();

      requestAnimationFrame(gameLoop);
    }

    function restartGame() {
      obstacles.forEach(obs => obs.element.remove());
      obstacles = [];

      gameOver = false;
      gameStarted = true;

      playerY = 0;
      velocityY = 0;

      isDucking = false;
      player.style.height = '120px';
      duck(false);

      score = 0;
      obstacleSpeed = window.innerWidth < 900 ? 4.5 : 7;

      scoreDisplay.textContent = 'Score: 0';

      gameOverScreen.style.display = 'none';

      requestAnimationFrame(gameLoop);
    }
  </script>

</body>

</html>
